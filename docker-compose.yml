services:
  postgres:
    image: postgres:16-alpine
    container_name: salo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salo
      POSTGRES_PASSWORD: salo
      POSTGRES_DB: salo
    ports:
      - '5432:5432'
    volumes:
      - salo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salo -d salo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salo-pgdata:
